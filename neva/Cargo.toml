[package]
name = "neva"
description = "MCP SDK for Rust"
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
sha2 = { version = "0.11.0", optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
http = "1.5.0"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = { version = "1.2.2" }
tokio = { version = "1.53.1", features = ["sync", "io-std", "io-util", "rt", "time", "macros"] }
tokio-util = "0.7.19"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

# optional
chacha20poly1305 = { version = "0.11.0", optional = true }
inventory = { version = "0.3.24", optional = true }
jsonschema = { version = "0.52.0", optional = true }
once_cell = { version = "1.21.4", features = ["std"], optional = true }
reqwest = { version = "0.13.4", features = ["stream", "json"], optional = true }
sse-stream = { version = "0.2.5", optional = true }
tokio-stream = { version = "0.1.19", optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json"], optional = true }
url = { version = "2.5.8", optional = true }
volga = { version = "0.9.9", features = ["di", "jwt-auth-full"], optional = true }
volga-di = { version = "0.9.9", optional = true }
volga-oauth-core = { version = "0.9.9", optional = true }
volga-oauth-client = { version = "0.9.9", optional = true }

# neva
neva_macros = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.0", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics", "Win32_System_Diagnostics_ToolHelp"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.1", features = ["signal"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1.19" }

[features]
default = []
full = ["server-full", "client-full"]
di = ["dep:volga-di"]
macros = ["dep:neva_macros", "dep:inventory"]
tasks = []
# MCP Apps (SEP-1865): `ui://` resources and the `_meta.ui` blocks that bind a
# tool to one. Additive, no new dependencies.
apps = []
tracing = ["dep:tracing", "dep:tracing-subscriber", "dep:once_cell", "volga?/tracing"]

# server
server-full = ["server-macros", "tracing", "http-server-volga", "server-tls", "server-oauth", "di", "tasks", "apps"]
server-macros = ["server", "macros", "neva_macros?/server"]
server-tls = ["http-server-volga", "volga?/tls", "volga?/dev-cert"]
server-oauth = ["http-server", "dep:volga-oauth-core", "volga?/oauth-client"]
# Engine-agnostic Streamable HTTP abstractions. Enable this and implement
# `HttpEngine` for your own stack (e.g. axum, hyper). No Volga in deps.
http-server = ["server", "dep:tokio-stream"]
# Default Volga adapter — pulls Volga as a dep and provides VolgaEngine.
http-server-volga = ["http-server", "dep:volga"]
# `chacha20poly1305` + `sha2` back the MRTR `requestState` sealing codec
# (`types/mrtr/state.rs`), which is server-only and compiled out under
# `legacy-spec`. Cargo features are additive, so they cannot be un-enabled by
# `legacy-spec`; a legacy server build simply never links them.
server = ["tokio/signal", "tokio/rt-multi-thread", "dep:chacha20poly1305", "dep:sha2"]

# client
client-full = ["client-macros", "tracing", "http-client", "client-tls", "client-oauth", "client-oauth-jwt", "client-oauth-dpop", "tasks", "apps"]
client-macros = ["client", "macros", "neva_macros?/client"]
# `url` is free here: it, `form_urlencoded` and `percent-encoding` are already
# in the tree of every `http-client` build via reqwest, so gating it on this
# feature adds a name to link against, not a crate to compile.
client-oauth = ["http-client", "dep:volga-oauth-client", "dep:url"]
# `private_key_jwt` client authentication (RFC 7523 Section 2.2), the only
# part of the OAuth client that needs a JWS signing backend. Kept opt-in so a
# client that authenticates with a secret -- or with nothing at all -- does
# not compile `jsonwebtoken` and its crypto tree.
client-oauth-jwt = ["client-oauth", "volga-oauth-client?/private-key-jwt"]
# DPoP sender-constrained tokens (RFC 9449): the client binds every token it
# obtains to a key it holds and proves possession of that key on each request.
# Opt-in for the same reason `client-oauth-jwt` is -- it needs the JWS signing
# backend, and a client presenting bearer tokens has no use for it.
client-oauth-dpop = ["client-oauth", "volga-oauth-client?/dpop"]
client-tls = ["reqwest?/rustls"]
http-client = ["client", "dep:reqwest", "dep:sse-stream", "dep:tokio-stream", "dep:once_cell"]
client = ["dep:windows", "dep:nix", "dep:jsonschema", "tokio/process", "tokio/signal", "tokio/rt-multi-thread"]

# Opt-in legacy protocol profile: MCP 2024-11-05 .. 2025-11-25.
# The default build targets MCP 2026-07-28; enabling this flag compiles that
# generation out and restores the pre-2026-07-28 wire surface
# (`initialize` handshake, session-bound SSE transport, top-level `tasks`
# capability, legacy `ToolSchema`, `with_mcp_version`, ...).
legacy-spec = ["neva_macros?/legacy-spec"]

[package.metadata.docs.rs]
# Not `all-features`: that would turn on `legacy-spec`, which compiles the
# 2026-07-28 surface *out*. docs.rs would then publish the legacy profile as if
# it were the crate -- no `server/discover`, no MRTR, no `DetailedTask`, and
# `with_mcp_version` presented as current. `full` is every feature except the
# generation flag, which is the default build users get.
features = ["full"]