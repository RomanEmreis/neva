[package]
name = "neva_macros"
description = "Macros for Neva"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full"] }
proc-macro2 = "1.0.107"
serde_json = "1.0.151"

[features]
default = []
server = []
client = []

# Forwarded from neva. Switches the `#[tool]` macro back to emitting legacy
# `ToolSchema` registration code instead of JSON Schema 2020-12
# (`InputSchema`), which is what the default (MCP 2026-07-28) build emits.
legacy-spec = []