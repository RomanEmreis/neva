[package]
name = "example-actix"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
neva = { path = "../../neva", features = ["http-server", "server-macros", "tracing", "di"] }
# Default features minus two, each of which is the only thing that pulls a
# vulnerable crate with no fixed release on the line actix requires. `cargo
# audit` runs over the whole workspace lockfile, examples included, and the
# example exists to show `HttpEngine` wired to actix, so it needs neither:
#
# - `http2` pulls `h2` 0.3 (RUSTSEC-2026-0258, unbounded empty DATA frames).
#   The remedy is 0.4.16+, and `actix-http` still requires `h2 ^0.3` as of
#   3.13.3. Nothing here serves HTTP/2.
# - `cookies` pulls `cookie` 0.16 (RUSTSEC-2026-0594, private cookie nonces
#   can repeat after fork). The remedy is 0.18.3+, and `actix-web` still
#   requires `cookie ^0.16` as of 4.20.0. Nothing here reads or sets cookies.
#
# Drop `default-features` and this list once actix moves to `h2` 0.4 and
# `cookie` 0.18.
actix-web = { version = "4", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "unicode",
    "compat",
    "ws",
] }
bytes = "1.11"
http = "1.4"
serde_json = "1"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = "0.7"
tracing-subscriber = "0.3"
