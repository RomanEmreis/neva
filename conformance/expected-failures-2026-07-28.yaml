# Known failures of the default (MCP 2026-07-28) build against
# @modelcontextprotocol/conformance at the version pinned in
# `conformance/.conformance-version`.
#
# This is a strict baseline, not a mute button:
#   - an unlisted failure fails the build (a regression)
#   - a listed entry that starts passing fails the build (a stale entry)
# So every line here is a debt with an owner, and removing one is how a fix is
# proved. Each entry names the defect that retires it; the ones marked
# `TBD: no issue yet` still need one filed.
#
# Entries may name a whole scenario or a single check (`scenario:check-id`).
# Prefer the latter whenever most of a scenario's checks pass -- excusing the
# scenario would stop enforcing the ones that already hold.

server:
  # `server-stateless` (30 checks) and `sep-2164-resource-not-found` are fully
  # green: the method-not-found status, the header/body version precedence and
  # the `error.data.uri` on a missing resource were the first three findings of
  # this harness and are fixed.

  # `dns-rebinding-protection` is green: a loopback server now answers only to
  # loopback names and refuses anything else with 403.

  # -- MRTR -----------------------------------------------------------------
  # The round-trip itself is green: `inputResponses` / `requestState` now ride
  # on the params where `InputResponseRequestParams` puts them, and the
  # elicitation payload is no longer wrapped in a `{"Form": ...}` object. What
  # is left are four distinct behaviors, one check each.

  # A round asks for exactly one input (TBD: no issue yet).
  # `ctx.elicit` / `ctx.sample` / `ctx.list_roots` each return the moment they
  # are awaited, so a handler that needs three inputs spends three rounds on
  # them. `InputRequiredResult.inputRequests` is a map precisely so a server
  # can ask for all of them at once.
  - input-required-result-multiple-input-requests:sep-2322-multiple-inputs-incomplete

  # A handler cannot see what the client declared (TBD: no issue yet).
  # The scenario expects the server to ask only for kinds the caller supports
  # -- sampling but not elicitation, here. neva knows the declared set (it
  # refuses an undeclared kind with `-32021`), but `Context` exposes no
  # accessor, so a handler cannot branch on it and the refusal is all the
  # caller gets.
  - input-required-result-capability-check:sep-2322-respect-client-capabilities

  # Two SHOULDs about being forgiving, both currently answered with an error.
  # They surfaced only once the answers were read at all, which is why they are
  # new here rather than resolved:
  #   * answers echoed without a `requestState` are rejected instead of ignored;
  #   * a missing answer is rejected instead of re-requested with a fresh
  #     `InputRequiredResult`.
  # Warnings count toward the exit code in a requirements run, so both need an
  # entry.
  - input-required-result-ignore-extra-params:sep-2322-ignore-unexpected-params
  - input-required-result-missing-input-response:sep-2322-missing-response-rerequests

client:
  # -- OAuth client flows (#86) -------------------------------------------
  # The client fixture connects unauthenticated; every scenario that drives a
  # discovery/registration/token exchange needs an OAuth-capable client fixture
  # first. Tracked with the credential-binding/CIMD work.
  - auth/metadata-default
  - auth/metadata-var1
  - auth/metadata-var2
  - auth/metadata-var3
  - auth/basic-cimd
  - auth/scope-from-www-authenticate
  - auth/scope-from-scopes-supported
  - auth/scope-omitted-when-undefined
  - auth/scope-step-up
  - auth/scope-retry-limit
  - auth/token-endpoint-auth-basic
  - auth/token-endpoint-auth-post
  - auth/token-endpoint-auth-none
  - auth/pre-registration
  - auth/offline-access-scope
  - auth/offline-access-not-supported
  - auth/authorization-server-migration
  - auth/iss-supported
  - auth/iss-not-advertised
  - auth/iss-supported-missing
  - auth/iss-wrong-issuer
  - auth/iss-unexpected
  - auth/iss-normalized
  - auth/metadata-issuer-mismatch

  # `sep-2322-client-request-state` is green: the retry echoes `requestState`
  # byte-exact on the params, takes a fresh JSON-RPC id, omits the state when
  # the server sent none, and leaks neither field into an unrelated call.

  # -- `x-mcp-header` parameter mirroring (TBD: no issue yet) ---------------------------
  # Clients MUST mirror tool parameters annotated with `x-mcp-header` into
  # `Mcp-Param-*` headers. neva's client does not read the annotation.
  - http-custom-headers
  - http-invalid-tool-headers

  # -- JSON Schema handling in the client (TBD: no issue yet) ---------------------------
  # `$ref` must survive untouched and 2020-12 keywords must be preserved when
  # a tool schema is round-tripped.
  - json-schema-ref-no-deref
  - json-schema-2020-12-preservation

  # -- request-metadata emits a warning, not a failure --------------------
  # Listed because the runner counts the scenario as failing on its warning.
  - request-metadata
