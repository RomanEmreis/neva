[package]
name = "neva-conformance"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Fixtures driven by the official MCP conformance suite. Not published."

[[bin]]
name = "conformance-server"
path = "src/bin/server.rs"

[[bin]]
name = "conformance-client"
path = "src/bin/client.rs"

[dependencies]
neva = { path = "../neva", features = [
    "server-macros",
    "http-server-volga",
    "client-macros",
    "http-client",
    "client-oauth",
    "tracing",
    "tasks",
] }
# The authorization scenarios have no user and no browser: their mock issuer
# redirects straight back from `GET /authorize`, so the fixture reads the
# redirect itself instead of opening one.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
# Build the fixtures against the pre-2026-07-28 wire profile. The suite is then
# run with `--requirements 2025-11-25` at the version pinned in
# `.conformance-version`; see conformance/README.md.
legacy-spec = ["neva/legacy-spec"]
