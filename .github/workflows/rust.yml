name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check_format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check
        
  clippy_check:
    runs-on: ubuntu-latest
    needs: check_format
    
    steps:
      - uses: actions/checkout@v4
      - name: Run all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run slim server
        run: cargo clippy --all-targets --features server -- -D warnings
      - name: Run server with macros
        run: cargo clippy --all-targets --features server-macros -- -D warnings
      - name: Run http server
        run: cargo clippy --all-targets --features http-server -- -D warnings
      - name: Run all features server
        run: cargo clippy --all-targets --features server-full -- -D warnings
      - name: Run slim client
        run: cargo clippy --all-targets --features client -- -D warnings
      - name: Run client with macros
        run: cargo clippy --all-targets --features client-macros -- -D warnings
      - name: Run http client
        run: cargo clippy --all-targets --features http-client -- -D warnings
      - name: Run all features client
        run: cargo clippy --all-targets --features client-full -- -D warnings
      - name: Run server+client
        run: cargo clippy --all-targets --features "server-full client-full" -- -D warnings
      # `--all-features` turns `legacy-spec` on, so the rows above cover the
      # default (MCP 2026-07-28) profile and the rows below cover the legacy one.
      - name: Run server+client with legacy-spec
        run: cargo clippy --all-targets --features "server-full client-full legacy-spec" -- -D warnings
      - name: Run slim client with legacy-spec
        run: cargo clippy --all-targets --features "client legacy-spec" -- -D warnings
      - name: Run slim server with legacy-spec
        run: cargo clippy --all-targets --features "server legacy-spec" -- -D warnings

  msrv_check:
    runs-on: ubuntu-latest
    needs: check_format

    # Every other job runs on the runner's default stable toolchain, so the MSRV
    # advertised by `rust-version` in the workspace manifest (and by the README
    # badge) is otherwise never exercised. `--all-targets` pulls in dev-dependencies,
    # which is where an MSRV regression is most likely to sneak in.
    steps:
      - uses: actions/checkout@v4
      - name: Read MSRV from the workspace manifest
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Check the published crates on MSRV
        run: cargo check --locked --all-features --all-targets

  workspace_check:
    runs-on: ubuntu-latest
    needs: check_format

    # `default-members` excludes `examples/*`, so no other job ever compiles them
    # and a dependency bump can leave an example behind without failing CI.
    # `--workspace` overrides `default-members` and covers every member.
    steps:
      - uses: actions/checkout@v4
      - name: Check the entire workspace, examples included
        run: cargo check --locked --workspace --all-features --all-targets

  audit:
    runs-on: ubuntu-latest
    needs: check_format

    # audit-check publishes results via the Checks API; without `checks: write`
    # it fails hard on push and silently passes on pull_request.
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
      - name: Security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  doc_check:
    runs-on: ubuntu-latest
    needs: clippy_check
    env:
      RUSTDOCFLAGS: "-D warnings"

    steps:
      - uses: actions/checkout@v4
      - name: Check docs build clean
        run: cargo doc --no-deps --all-features
      - name: Check docs build clean with legacy-spec
        run: cargo doc --no-deps --features "server-full client-full legacy-spec"
      # The rows above have every feature on, so every intra-doc link resolves
      # by construction. Slim rows catch docs that link to items a smaller
      # feature set does not compile.
      - name: Check docs build clean on a slim server
        run: cargo doc --no-deps --features server
      - name: Check docs build clean on a slim client
        run: cargo doc --no-deps --features client
      - name: Check docs build clean on a client-only legacy build
        run: cargo doc --no-deps --features "client legacy-spec"

  build:
    environment: CICD
    runs-on: ubuntu-latest
    needs: clippy_check

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Run all features tests
        run: cargo test --all-features --verbose
      - name: Run server tests
        run: cargo test --features server-full --verbose
      - name: Run client tests
        run: cargo test --features client-full --verbose
      - name: Run server+client tests
        run: cargo test --features "server-full client-full" --verbose
      - name: Run tests with legacy-spec
        run: cargo test --features "server-full client-full legacy-spec" --verbose
